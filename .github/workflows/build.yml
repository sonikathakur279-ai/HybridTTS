name: Build HybridTTS Production APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle Build Tool
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.6'

      - name: Grant Execute Permissions to Gradle
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
          fi

      - name: Compile Debug APK
        run: |
          gradle assembleDebug --stacktrace --no-daemon

      - name: Verify Compiled APK Artifact
        run: |
          ls -lh app/build/outputs/apk/debug/

      - name: Upload Daily Test APK
        uses: actions/upload-artifact@v4
        with:
          name: HybridTTS-Day1-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
